services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg-shopper-bot
    restart: unless-stopped
    shm_size: '1gb'
    init: true
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
